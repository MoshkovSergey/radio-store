<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Radio Store">
  <defs>
    <linearGradient id="rs-base" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b5cff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <radialGradient id="rs-gloss" cx="20" cy="14" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Фон-квадрат со скруглением, как .logo-mark в шапке -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#rs-base)"/>

  <!-- Глянцевый блик поверх фона (та же форма, чтобы не вылезать за скругление) -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#rs-gloss)"/>

  <!-- Монограмма RS. Без dominant-baseline: y задан как базовая линия,
       чтобы одинаково рендерилось в старых движках favicon. -->
  <text
    x="32"
    y="43"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="-1"
    fill="#ffffff">RS</text>
</svg>